name: Build DeskViora.exe

# Builds a real Windows .exe on GitHub's Windows runner — no Windows machine
# of your own needed. Runs automatically on every push, and can also be
# triggered manually from the Actions tab ("Run workflow" button).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the .exe
        run: pyinstaller build.spec

      - name: Upload desktop app .exe
        uses: actions/upload-artifact@v4
        with:
          name: deskviora-source.exe
          path: dist/deskviora-source.exe

      - name: Publish Windows executable release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deskviora-source.exe
          fail_on_unmatched_files: true
