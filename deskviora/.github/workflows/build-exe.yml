name: Build DeskViora.exe

# Builds a real Windows .exe on GitHub's Windows runner — no Windows machine
# of your own needed. Runs automatically on every push, and can also be
# triggered manually from the Actions tab ("Run workflow" button).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the .exe
        run: pyinstaller build.spec

      - name: Upload DeskViora.exe
        uses: actions/upload-artifact@v4
        with:
          name: DeskViora-windows
          path: dist/DeskViora.exe
